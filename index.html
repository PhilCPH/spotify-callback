<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Spotify koppeln</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0d1320;color:#eef2f8;font-family:Roboto,"Segoe UI",Arial,sans-serif}
  main{max-width:34rem;padding:1.5rem}
  h1{font-size:1.4rem;font-weight:500;margin:0 0 .8rem}
  p{color:#8b99b0;line-height:1.5}
  textarea{width:100%;box-sizing:border-box;height:9rem;background:#111827;color:#eef2f8;border:1px solid #27344b;border-radius:.6rem;padding:.8rem;font:0.95rem ui-monospace,Menlo,Consolas,monospace;resize:none}
  button{margin-top:.8rem;background:#2ec4a6;color:#06241e;border:0;border-radius:.6rem;padding:.8rem 1.2rem;font-size:1.05rem;font-weight:600;cursor:pointer}
  .err{color:#ff5d5d}
</style>
</head>
<body>
<main id="m"></main>
<script>
  // Diese Seite zeigt nur den Code an, den Spotify zurückgibt. Sie sendet nichts weiter und speichert nichts.
  const q = new URLSearchParams(location.search);
  const code = q.get("code"), state = q.get("state") || "", err = q.get("error");
  const m = document.getElementById("m");
  const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  if (code){
    const val = code + (state ? "|" + state : "");
    m.innerHTML = `<h1>Fast fertig</h1>
      <p>Kopiere den Text unten und füge ihn im Dashboard ein (Spotify-Karte → „Code einfügen“).</p>
      <textarea id="c" readonly>${esc(val)}</textarea>
      <button id="b">Kopieren</button>
      <p id="s"></p>`;
    document.getElementById("b").onclick = async () => {
      const t = document.getElementById("c"); t.select();
      try{ await navigator.clipboard.writeText(t.value); document.getElementById("s").textContent = "Kopiert."; }
      catch(e){ document.getElementById("s").textContent = "Text markiert. Bitte lange tippen und „Kopieren“ wählen."; }
    };
    history.replaceState(null, "", location.pathname);       // Code aus der Adresszeile entfernen
  } else if (err){
    m.innerHTML = `<h1 class="err">Spotify hat abgebrochen</h1><p>Grund: ${esc(err)}. Starte die Kopplung im Dashboard erneut.</p>`;
  } else {
    m.innerHTML = `<h1>Rückleitungsseite für Spotify</h1><p>Diese Seite wird automatisch aufgerufen, nachdem du Spotify im Dashboard erlaubt hast. Es gibt hier nichts einzustellen.</p>`;
  }
</script>
</body>
</html>
